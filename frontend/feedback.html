<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback · Redeemo</title>
  <meta name="description" content="Send feedback on Redeemo." />
  <link rel="icon" href="images/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <nav class="navbar" id="navbar" aria-label="Main navigation"></nav>

  <main id="main" class="page">
    <div class="page-header">
      <p class="eyebrow">Suggestion Box</p>
      <h1>Send Feedback</h1>
      <p>Found a bug or have an idea for a new quest or reward? Let us know.</p>
    </div>

    <div class="form-success" id="success-box" role="status"></div>
    <div class="form-error" id="error-box" role="alert"></div>

    <form id="feedback-form" class="feedback-form" novalidate>
      <div class="field">
        <label for="message">Your message</label>
        <textarea id="message" name="message" required minlength="3"></textarea>
      </div>
      <button type="submit" class="btn" id="submit-btn" style="width: auto; padding: 12px 32px;">Send Feedback</button>
    </form>
  </main>

  <footer>Redeemo — a portfolio project. Not a real rewards program.</footer>

  <script src="js/api.js"></script>
  <script>
    Auth.requireAuth();
    renderNav('feedback.html');

    const form = document.getElementById('feedback-form');
    const successBox = document.getElementById('success-box');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      successBox.classList.remove('visible');
      errorBox.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      try {
        const message = document.getElementById('message').value.trim();
        const data = await apiRequest('/feedback', { method: 'POST', body: { message } });
        successBox.textContent = data.message;
        successBox.classList.add('visible');
        form.reset();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Feedback';
      }
    });
  </script>
</body>
</html>
